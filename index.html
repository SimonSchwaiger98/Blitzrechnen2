<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Blitzrechnen</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Fredoka One', sans-serif;
  background: linear-gradient(135deg, #dbe7f1, #f4f7fb);
  text-align: center;
  padding: 40px;
  margin: 0;
}

h1 {
  font-size: 56px;
  margin-bottom: 20px;
}

#taskDisplay {
  font-size: 52px;
  margin: 60px auto;
  min-height: 100px;
  padding: 30px 50px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.08);
  transition: all 0.2s ease;
}

button {
  font-family: inherit;
  font-size: 16px;
  padding: 12px 20px;
  border-radius: 12px;
  border: none;
  background: white;
  box-shadow: 0 6px 15px rgba(0,0,0,0.08);
  cursor: pointer;
  transition: all 0.2s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.12);
}

.duration-btn.active,
.toggle-btn.active {
  background: #3b82f6;
  color: white;
}

#modeSelection button,
#difficultySelection button {
  font-size: 18px;
  padding: 14px 28px;
  margin: 10px;
}

#modeSelection h2,
#difficultySelection h2 {
  margin-top: 8px;
  margin-bottom: 14px;
  font-size: 26px;
}

#answerInput {
  font-size: 24px;
  padding: 14px;
  width: 200px;
  border-radius: 12px;
  border: none;
  background: #e8f5e9;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.08);
}

#answerInput.wrong {
  background: #fde2e2;
}

#stats {
  margin-top: 20px;
  font-size: 18px;
  opacity: 0.7;
}

#menuBtn {
  position: absolute;
  top: 25px;
  left: 25px;
  font-size: 18px;
  padding: 10px 16px;
  border-radius: 12px;
  background: white;
  box-shadow: 0 6px 15px rgba(0,0,0,0.08);
}

#summary {
  margin-top: 30px;
}

#perfectImg {
  display: none;
  width: 120px;
  height: auto;
  margin-top: 20px;
}

/* ===== Growth Mindset Skala ===== */

#reflectionSection {
  margin-top: 40px;
}

.scale-wrapper {
  position: relative;
  max-width: 500px;
  margin: 30px auto;
}

.scale-line {
  display: flex;
  justify-content: space-between;
  font-size: 40px;
  position: relative;
}

.scale-line::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 5%;
  right: 5%;
  height: 4px;
  background: #d1d5db;
  transform: translateY(-50%);
  border-radius: 4px;
  z-index: 0;
}

.scale-item {
  cursor: pointer;
  z-index: 1;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.scale-item:hover {
  transform: scale(1.2);
}

.marker {
  position: absolute;
  font-size: 22px;
  transition: left 0.3s ease;
}

.marker.self {
  color: black;
  top: 55px;
}

.marker.system {
  color: #16a34a;
  top: 80px;
}

/* ===== Tablet Keyboard ===== */

#tabletKeyboard {
  margin-top: 25px;
}

.keyboard-row {
  display: flex;
  justify-content: center;
  margin-bottom: 10px;
}

#tabletKeyboard button {
  width: 70px;
  height: 60px;
  font-size: 22px;
  margin: 6px;
  border-radius: 18px;
  background: #f0f9ff;
  box-shadow: 0 6px 12px rgba(0,0,0,0.1);
  transition: transform 0.1s ease;
}

#tabletKeyboard button:active {
  transform: scale(0.95);
}

.enter-btn {
  width: 240px !important;
  background: #bbf7d0 !important;
}
</style>
</head>

<body>

<h1>⚡ Blitzrechnen ⚡</h1>

<div id="modeSelection">
  <h2>Was möchtest du üben?</h2>

  <button onclick="chooseMode('addition100')">
    ➕ Addition bis 100
  </button>

  <button onclick="chooseMode('subtraktion100')">
    ➖ Subtraktion bis 100
  </button>

  <button onclick="chooseMode('addition1000')">
    ➕ Addition bis 1000
  </button>

  <button onclick="chooseMode('subtraktion1000')">
    ➖ Subtraktion bis 1000
  </button>
</div>

<div id="difficultySelection" style="display:none;">
  <h2 id="difficultyTitle">Wie möchtest du üben?</h2>

  <button onclick="setDifficulty(1)">🌱 Einfach</button>
  <button onclick="setDifficulty(2)">🌿 Mittel</button>
  <button onclick="setDifficulty(3)">🌳 Schwierig</button>
</div>

<button id="menuBtn" onclick="goToMenu()">🏠</button>

<div>
  Anzeigezeit:
  <button class="duration-btn active" onclick="setDuration(2000,this)">🚀</button>
  <button class="duration-btn" onclick="setDuration(3500,this)">🐇</button>
  <button class="duration-btn" onclick="setDuration(4500,this)">🐢</button>
</div>

<div id="taskDisplay">Bitte Modus wählen</div>

<div>
  <label style="font-size:20px;">Lösung: </label>
  <input type="text" id="answerInput" inputmode="numeric">
  <button onclick="repeatTask()">🔁 Wiederholen</button>
</div>

<div id="tabletKeyboard" style="display:none;">
  <div class="keyboard-row">
    <button onclick="pressKey('7')">7</button>
    <button onclick="pressKey('8')">8</button>
    <button onclick="pressKey('9')">9</button>
  </div>

  <div class="keyboard-row">
    <button onclick="pressKey('4')">4</button>
    <button onclick="pressKey('5')">5</button>
    <button onclick="pressKey('6')">6</button>
  </div>

  <div class="keyboard-row">
    <button onclick="pressKey('1')">1</button>
    <button onclick="pressKey('2')">2</button>
    <button onclick="pressKey('3')">3</button>
  </div>

  <div class="keyboard-row">
    <button onclick="pressKey('0')">0</button>
    <button onclick="deleteKey()">⌫</button>
  </div>

  <div class="keyboard-row">
    <button class="enter-btn" onclick="checkAnswer()">✔</button>
  </div>
</div>

<div id="stats">0 von 10 beim ersten Versuch richtig</div>

<div id="summary" style="display:none;">
  <p id="finalMessage"></p>

  <div id="reflectionSection" style="display:none;">
    <h3>🌱 Wie lief es für dich?</h3>

    <div class="scale-wrapper">
      <div class="scale-line">
        <div class="scale-item" onclick="selectReflection(1)">🌱</div>
        <div class="scale-item" onclick="selectReflection(2)">🌿</div>
        <div class="scale-item" onclick="selectReflection(3)">🌳</div>
        <div class="scale-item" onclick="selectReflection(4)">🌻</div>
      </div>

      <div id="selfMarker" class="marker self">▲</div>
      <div id="systemMarker" class="marker system" style="display:none;">▲</div>
    </div>
  </div>

  <img id="perfectImg" src="tiger pokal.png">
</div>


<script>

/* =========================================================
   GRUNDWERTE
   ========================================================= */

let selfRating = null;
let totalTasks = 10;
let currentTask = 0;
let correctCount = 0;
let correctAnswer = null;
let currentMode = null;
let currentDifficulty = null;
let currentTaskText = "";

let displayDuration = 2000;

let usedTasks = new Set();

let firstAttemptForCurrentTask = true;
let taskSolved = false;
let reflectionLocked = false;

/*
  NEU:
  Anzahl der falschen Versuche bei der aktuellen Aufgabe.
*/
let wrongAttempts = 0;


/* =========================================================
   ANZEIGEZEIT
   ========================================================= */

function setDuration(ms, btn) {
  displayDuration = ms;

  document.querySelectorAll(".duration-btn").forEach(
    b => b.classList.remove("active")
  );

  btn.classList.add("active");
}


/* =========================================================
   MODUS AUSWÄHLEN
   ========================================================= */

function chooseMode(mode) {

  currentMode = mode;

  document.getElementById("modeSelection").style.display = "none";
  document.getElementById("difficultySelection").style.display = "block";
  document.getElementById("menuBtn").style.display = "inline";
  document.getElementById("summary").style.display = "none";
  document.getElementById("perfectImg").style.display = "none";
  document.getElementById("reflectionSection").style.display = "none";

  const titles = {
    addition100: "➕ Addition bis 100",
    subtraktion100: "➖ Subtraktion bis 100",
    addition1000: "➕ Addition bis 1000",
    subtraktion1000: "➖ Subtraktion bis 1000"
  };

  document.getElementById("difficultyTitle").textContent =
    titles[mode] + " – wähle deine Stufe";

  document.getElementById("taskDisplay").textContent =
    "Wähle eine Schwierigkeitsstufe";
}


/* =========================================================
   SCHWIERIGKEIT
   ========================================================= */

function setDifficulty(level) {
  currentDifficulty = level;

  document.getElementById("difficultySelection").style.display = "none";

  startRound();
}


/* =========================================================
   HAUPTMENÜ
   ========================================================= */

function goToMenu() {

  currentMode = null;
  currentDifficulty = null;
  currentTaskText = "";
  wrongAttempts = 0;
  taskSolved = false;

  document.getElementById("modeSelection").style.display = "block";
  document.getElementById("difficultySelection").style.display = "none";
  document.getElementById("menuBtn").style.display = "none";
  document.getElementById("summary").style.display = "none";
  document.getElementById("reflectionSection").style.display = "none";
  document.getElementById("perfectImg").style.display = "none";

  document.getElementById("taskDisplay").textContent =
    "Bitte Modus wählen";

  document.getElementById("stats").textContent =
    "0 von 10 beim ersten Versuch richtig";

  const input = document.getElementById("answerInput");
  input.value = "";
  input.disabled = false;
  input.classList.remove("wrong");
}


/* =========================================================
   NEUE RUNDE
   ========================================================= */

function startRound() {

  currentTask = 0;
  correctCount = 0;
  selfRating = null;

  usedTasks = new Set();

  firstAttemptForCurrentTask = true;
  taskSolved = false;
  reflectionLocked = false;
  wrongAttempts = 0;

  document.getElementById("summary").style.display = "none";
  document.getElementById("reflectionSection").style.display = "none";
  document.getElementById("perfectImg").style.display = "none";
  document.getElementById("systemMarker").style.display = "none";
  document.getElementById("selfMarker").style.left = "0px";

  document.getElementById("stats").textContent =
    "0 von 10 beim ersten Versuch richtig";

  document.querySelectorAll(".scale-item").forEach(item => {
    item.style.pointerEvents = "auto";
    item.style.opacity = "1";
  });

  nextTask();
}


/* =========================================================
   HILFSFUNKTIONEN
   ========================================================= */

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function isWholeTen(n) {
  return n % 10 === 0;
}

function isWholeHundred(n) {
  return n % 100 === 0;
}


/* =========================================================
   AUFGABENGENERATOR AUSWÄHLEN
   ========================================================= */

function generateTask() {

  if (currentMode === "addition100") {
    return generateAddition100(currentDifficulty);
  }

  if (currentMode === "subtraktion100") {
    return generateSubtraktion100(currentDifficulty);
  }

  if (currentMode === "addition1000") {
    return generateAddition1000(currentDifficulty);
  }

  if (currentMode === "subtraktion1000") {
    return generateSubtraktion1000(currentDifficulty);
  }
}


/* =========================================================
   ADDITION BIS 100
   ========================================================= */

function generateAddition100(level) {

  let a, b, tries = 0;

  /* 🌱 Einfach: voller Zehner + andere Zahl */

  if (level === 1) {

    do {
      const zehner = randInt(1, 9) * 10;
      const andere = randInt(1, 99);

      if (!isWholeTen(andere) && zehner + andere <= 100) {
        a = zehner;
        b = andere;
        break;
      }

      tries++;

    } while (tries < 500);

    if (Math.random() < 0.5) {
      [a, b] = [b, a];
    }

    correctAnswer = a + b;

    return `${a} + ${b}`;
  }


  /* 🌿 Mittel: ohne Zehnerübergang */

  if (level === 2) {

    do {
      a = randInt(10, 89);
      b = randInt(10, 89);

      const ohneUebergang =
        (a % 10) + (b % 10) < 10;

      if (a + b <= 100 && ohneUebergang) {
        break;
      }

      tries++;

    } while (tries < 1000);

    correctAnswer = a + b;

    return `${a} + ${b}`;
  }


  /* 🌳 Schwierig: mit Zehnerübergang */

  do {
    a = randInt(10, 89);
    b = randInt(10, 89);

    const mitUebergang =
      (a % 10) + (b % 10) >= 10;

    if (a + b <= 100 && mitUebergang) {
      break;
    }

    tries++;

  } while (tries < 1000);

  correctAnswer = a + b;

  return `${a} + ${b}`;
}


/* =========================================================
   SUBTRAKTION BIS 100
   ========================================================= */

function generateSubtraktion100(level) {

  let a, b, tries = 0;

  /* 🌱 Einfach: Zahl minus voller Zehner */

  if (level === 1) {

    do {
      a = randInt(11, 99);
      b = randInt(1, 9) * 10;

      if (!isWholeTen(a) && b < a) {
        break;
      }

      tries++;

    } while (tries < 500);

    correctAnswer = a - b;

    return `${a} − ${b}`;
  }


  /* 🌿 Mittel: ohne Entbündeln */

  if (level === 2) {

    do {
      a = randInt(20, 99);
      b = randInt(10, a - 1);

      const ohneUebergang =
        (a % 10) >= (b % 10);

      if (ohneUebergang) {
        break;
      }

      tries++;

    } while (tries < 1000);

    correctAnswer = a - b;

    return `${a} − ${b}`;
  }


  /* 🌳 Schwierig: mit Entbündeln */

  do {
    a = randInt(20, 99);
    b = randInt(10, a - 1);

    const mitUebergang =
      (a % 10) < (b % 10);

    if (mitUebergang) {
      break;
    }

    tries++;

  } while (tries < 1000);

  correctAnswer = a - b;

  return `${a} − ${b}`;
}


/* =========================================================
   ADDITION BIS 1000
   ========================================================= */

function generateAddition1000(level) {

  let a, b, tries = 0;

  /* 🌱 Einfach: voller Hunderter + andere Zahl */

  if (level === 1) {

    do {
      const hunderter = randInt(1, 9) * 100;
      const andere = randInt(1, 999);

      if (
        !isWholeHundred(andere) &&
        hunderter + andere <= 1000
      ) {
        a = hunderter;
        b = andere;
        break;
      }

      tries++;

    } while (tries < 1000);

    if (Math.random() < 0.5) {
      [a, b] = [b, a];
    }

    correctAnswer = a + b;

    return `${a} + ${b}`;
  }


  /* 🌿 Mittel: ohne Übertrag */

  if (level === 2) {

    do {
      a = randInt(100, 899);
      b = randInt(100, 899);

      const einerOhneUebertrag =
        (a % 10) + (b % 10) < 10;

      const zehnerA =
        Math.floor(a / 10) % 10;

      const zehnerB =
        Math.floor(b / 10) % 10;

      const zehnerOhneUebertrag =
        zehnerA + zehnerB < 10;

      if (
        a + b <= 1000 &&
        einerOhneUebertrag &&
        zehnerOhneUebertrag
      ) {
        break;
      }

      tries++;

    } while (tries < 2000);

    correctAnswer = a + b;

    return `${a} + ${b}`;
  }


  /* 🌳 Schwierig: mindestens ein Übertrag */

  do {
    a = randInt(100, 899);
    b = randInt(100, 899);

    const einerUebertrag =
      (a % 10) + (b % 10) >= 10;

    const zehnerA =
      Math.floor(a / 10) % 10;

    const zehnerB =
      Math.floor(b / 10) % 10;

    const zehnerUebertrag =
      zehnerA + zehnerB >= 10;

    if (
      a + b <= 1000 &&
      (einerUebertrag || zehnerUebertrag)
    ) {
      break;
    }

    tries++;

  } while (tries < 2000);

  correctAnswer = a + b;

  return `${a} + ${b}`;
}


/* =========================================================
   SUBTRAKTION BIS 1000
   ========================================================= */

function generateSubtraktion1000(level) {

  let a, b, tries = 0;

  /* 🌱 Einfach: Zahl minus voller Hunderter */

  if (level === 1) {

    do {
      a = randInt(101, 999);
      b = randInt(1, 9) * 100;

      if (!isWholeHundred(a) && b < a) {
        break;
      }

      tries++;

    } while (tries < 1000);

    correctAnswer = a - b;

    return `${a} − ${b}`;
  }


  /* 🌿 Mittel: ohne Entbündeln */

  if (level === 2) {

    do {
      a = randInt(200, 999);
      b = randInt(100, a - 1);

      const einerA = a % 10;
      const einerB = b % 10;

      const zehnerA =
        Math.floor(a / 10) % 10;

      const zehnerB =
        Math.floor(b / 10) % 10;

      const hunderterA =
        Math.floor(a / 100);

      const hunderterB =
        Math.floor(b / 100);

      const ohneEntbuendeln =
        einerA >= einerB &&
        zehnerA >= zehnerB &&
        hunderterA >= hunderterB;

      if (ohneEntbuendeln) {
        break;
      }

      tries++;

    } while (tries < 2000);

    correctAnswer = a - b;

    return `${a} − ${b}`;
  }


  /* 🌳 Schwierig: mindestens einmal Entbündeln */

  do {
    a = randInt(200, 999);
    b = randInt(100, a - 1);

    const einerA = a % 10;
    const einerB = b % 10;

    const zehnerA =
      Math.floor(a / 10) % 10;

    const zehnerB =
      Math.floor(b / 10) % 10;

    const entbuendelnEiner =
      einerA < einerB;

    const entbuendelnZehner =
      zehnerA < zehnerB;

    if (entbuendelnEiner || entbuendelnZehner) {
      break;
    }

    tries++;

  } while (tries < 2000);

  correctAnswer = a - b;

  return `${a} − ${b}`;
}


/* =========================================================
   NÄCHSTE AUFGABE
   ========================================================= */

function nextTask() {

  if (currentTask >= totalTasks) {
    endRound();
    return;
  }

  const input =
    document.getElementById("answerInput");

  input.value = "";
  input.classList.remove("wrong");
  input.disabled = true;

  firstAttemptForCurrentTask = true;
  taskSolved = false;

  /*
    Bei jeder neuen Aufgabe beginnt die Zahl
    der Fehlversuche wieder bei 0.
  */
  wrongAttempts = 0;

  let newTask;
  let safety = 0;

  do {
    newTask = generateTask();
    safety++;

  } while (
    usedTasks.has(newTask) &&
    safety < 100
  );

  usedTasks.add(newTask);
  currentTaskText = newTask;

  document.getElementById("taskDisplay").textContent =
    currentTaskText;

  setTimeout(() => {

    document.getElementById("taskDisplay").textContent = "";

    input.disabled = false;
    input.focus();

  }, displayDuration);
}


/* =========================================================
   ANTWORT PRÜFEN
   ========================================================= */

function checkAnswer() {

  const input =
    document.getElementById("answerInput");

  if (
    taskSolved ||
    currentTask >= totalTasks ||
    input.disabled
  ) {
    return;
  }

  const raw =
    input.value.trim();

  if (raw === "") {
    return;
  }

  const value =
    parseInt(raw, 10);

  if (Number.isNaN(value)) {
    return;
  }

  input.disabled = true;


  /* =======================================================
     RICHTIGE ANTWORT
     ======================================================= */

  if (value === correctAnswer) {

    taskSolved = true;

    /*
      Nur eine sofort richtige Antwort zählt
      für die Statistik.
    */
    if (firstAttemptForCurrentTask) {
      correctCount++;
    }

    document.getElementById("taskDisplay").textContent =
      "Richtig! ✅";

    input.classList.remove("wrong");

    currentTask =
      Math.min(currentTask + 1, totalTasks);

    updateStats();

    setTimeout(() => {

      if (currentTask >= totalTasks) {
        endRound();
      } else {
        nextTask();
      }

    }, 1200);

    return;
  }


  /* =======================================================
     FALSCHE ANTWORT
     ======================================================= */

  firstAttemptForCurrentTask = false;
  wrongAttempts++;

  input.classList.add("wrong");


  /* =======================================================
     1. FEHLVERSUCH
     ======================================================= */

  if (wrongAttempts === 1) {

    document.getElementById("taskDisplay").textContent =
      "Noch nicht richtig – versuche es noch einmal. ❌";

    setTimeout(() => {

      input.value = "";
      input.classList.remove("wrong");
      input.disabled = false;

      document.getElementById("taskDisplay").textContent =
        "Versuche es noch einmal.";

      input.focus();

    }, 1100);

    return;
  }


  /* =======================================================
     2. FEHLVERSUCH
     Aufgabe wird automatisch erneut gezeigt.
     ======================================================= */

  if (wrongAttempts === 2) {

    document.getElementById("taskDisplay").textContent =
      "Schau dir die Aufgabe noch einmal genau an. 👀";

    setTimeout(() => {

      input.value = "";
      input.classList.remove("wrong");

      /*
        Aufgabe wird erneut für die gewählte
        Anzeigezeit eingeblendet.
      */
      document.getElementById("taskDisplay").textContent =
        currentTaskText;

      setTimeout(() => {

        document.getElementById("taskDisplay").textContent = "";

        input.disabled = false;
        input.focus();

      }, displayDuration);

    }, 1200);

    return;
  }


  /* =======================================================
     3. FEHLVERSUCH
     Richtige Lösung wird gezeigt.
     Danach geht es automatisch weiter.
     ======================================================= */

  if (wrongAttempts >= 3) {

    taskSolved = true;

    input.value = "";
    input.classList.remove("wrong");
    input.disabled = true;

    document.getElementById("taskDisplay").innerHTML =
      `Die Lösung ist:<br><strong>${currentTaskText} = ${correctAnswer}</strong> 💡`;

    /*
      Die Aufgabe ist jetzt abgeschlossen,
      zählt aber NICHT als beim ersten Versuch richtig.
    */
    currentTask =
      Math.min(currentTask + 1, totalTasks);

    updateStats();

    /*
      Lösung bleibt 3,5 Sekunden sichtbar.
    */
    setTimeout(() => {

      if (currentTask >= totalTasks) {
        endRound();
      } else {
        nextTask();
      }

    }, 3500);
  }
}


/* =========================================================
   STATISTIK AKTUALISIEREN
   ========================================================= */

function updateStats() {

  document.getElementById("stats").textContent =
    `${correctCount} von ${totalTasks} beim ersten Versuch richtig`;
}


/* =========================================================
   AUFGABE MANUELL WIEDERHOLEN
   ========================================================= */

function repeatTask() {

  if (
    !currentTaskText ||
    taskSolved ||
    currentTask >= totalTasks
  ) {
    return;
  }

  const input =
    document.getElementById("answerInput");

  input.disabled = true;

  document.getElementById("taskDisplay").textContent =
    currentTaskText;

  setTimeout(() => {

    document.getElementById("taskDisplay").textContent = "";

    input.disabled = false;
    input.focus();

  }, displayDuration);
}


/* =========================================================
   RUNDE BEENDEN
   ========================================================= */

function endRound() {

  taskSolved = true;

  document.getElementById("answerInput").disabled = true;

  document.getElementById("taskDisplay").textContent =
    "Geschafft! 🎉";

  document.getElementById("summary").style.display =
    "block";

  document.getElementById("finalMessage").textContent =
    `🎉 Fertig! ${correctCount} von ${totalTasks} Aufgaben waren beim ersten Versuch richtig.`;

  if (correctCount === totalTasks) {

    document.getElementById("perfectImg").style.display =
      "block";

  } else {

    document.getElementById("perfectImg").style.display =
      "none";
  }

  document.getElementById("reflectionSection").style.display =
    "block";

  document.getElementById("systemMarker").style.display =
    "none";
}


/* =========================================================
   SELBSTEINSCHÄTZUNG
   ========================================================= */

function selectReflection(level) {

  if (reflectionLocked) {
    return;
  }

  selfRating = level;
  reflectionLocked = true;

  positionSelfMarker(level);

  /*
    Systemeinschätzung wird erst nach der
    Selbsteinschätzung sichtbar.
  */
  document.getElementById("systemMarker").style.display =
    "block";

  positionSystemMarker();

  document.querySelectorAll(".scale-item").forEach(item => {
    item.style.pointerEvents = "none";
    item.style.opacity = "0.92";
  });
}


/* =========================================================
   SYSTEMEINSCHÄTZUNG
   ========================================================= */

function getSystemLevel() {

  if (correctCount <= 3) {
    return 1;
  }

  if (correctCount <= 6) {
    return 2;
  }

  if (correctCount <= 8) {
    return 3;
  }

  return 4;
}


/* =========================================================
   MARKER POSITIONIEREN
   ========================================================= */

function positionSelfMarker(level) {

  const items =
    document.querySelectorAll(".scale-item");

  const marker =
    document.getElementById("selfMarker");

  const rect =
    items[level - 1].getBoundingClientRect();

  const wrapperRect =
    document.querySelector(".scale-wrapper").getBoundingClientRect();

  const center =
    rect.left - wrapperRect.left + rect.width / 2;

  marker.style.left =
    (center - marker.offsetWidth / 2) + "px";
}


function positionSystemMarker() {

  const systemLevel =
    getSystemLevel();

  const items =
    document.querySelectorAll(".scale-item");

  const marker =
    document.getElementById("systemMarker");

  const rect =
    items[systemLevel - 1].getBoundingClientRect();

  const wrapperRect =
    document.querySelector(".scale-wrapper").getBoundingClientRect();

  const center =
    rect.left - wrapperRect.left + rect.width / 2;

  marker.style.left =
    (center - marker.offsetWidth / 2) + "px";
}


/* =========================================================
   TOUCH / TABLET ERKENNEN
   ========================================================= */

window.addEventListener("load", function() {

  const input =
    document.getElementById("answerInput");

  document.getElementById("menuBtn").style.display =
    "none";

  if (
    ('ontouchstart' in window) ||
    navigator.maxTouchPoints > 0
  ) {

    document.getElementById("tabletKeyboard").style.display =
      "block";

    input.setAttribute("readonly", true);

  } else {

    input.removeAttribute("readonly");
  }
});


/* =========================================================
   TABLET-TASTATUR
   ========================================================= */

function pressKey(key) {

  const input =
    document.getElementById("answerInput");

  if (input.disabled) {
    return;
  }

  input.value += key;
}


function deleteKey() {

  const input =
    document.getElementById("answerInput");

  if (input.disabled) {
    return;
  }

  input.value =
    input.value.slice(0, -1);
}


/* =========================================================
   ENTER-TASTE AM COMPUTER
   ========================================================= */

document.addEventListener("keydown", function(e) {

  const isTouch =
    ('ontouchstart' in window) ||
    navigator.maxTouchPoints > 0;

  if (
    !isTouch &&
    e.key === "Enter"
  ) {

    const input =
      document.getElementById("answerInput");

    if (
      !input.disabled &&
      input.value.trim() !== ""
    ) {
      checkAnswer();
    }
  }
});

</script>
